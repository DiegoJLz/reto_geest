services:
  db:
    image: postgres:16-alpine
    container_name: geest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-geest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geest}
      POSTGRES_DB: ${DB_NAME:-geest}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - geest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-geest} -d ${DB_NAME:-geest}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-geest}
      DB_PASSWORD: ${DB_PASSWORD:-geest}
      DB_NAME: ${DB_NAME:-geest}
      DB_SSL: 'false'
      AUTO_RUN_MIGRATIONS: 'true'
      NOTIFY_URL: ${NOTIFY_URL:-https://webhook.site/placeholder}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-3}
      NOTIFY_INITIAL_BACKOFF_MS: ${NOTIFY_INITIAL_BACKOFF_MS:-500}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  geest_pgdata:
    name: geest_pgdata
