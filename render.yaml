# Render Blueprint — provisiona toda la infra desde este archivo.
#
# Cómo usarlo (una sola vez):
#   1. Ir a https://dashboard.render.com → New → Blueprint
#   2. Conectar el repo DiegoJLz/reto_geest
#   3. Render detecta render.yaml y lista los recursos → Apply
#   4. Setear env var `NOTIFY_URL` en ambos web services (no va en el yaml
#      porque cada dev/equipo tiene su propio webhook.site)
#
# Deploys: autoDeploy=false en todos. Los deploys los dispara GitHub Actions
# (.github/workflows/deploy.yml) solo cuando CI pasa. Esto evita mergear
# código roto directo a producción.

databases:
  - name: geest-db
    databaseName: geest
    user: geest
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ============================================================================
  # PRODUCTION — rama main, Starter plan (no sleep, para los 7 días de eval)
  # ============================================================================
  - type: web
    name: geest-api-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: geest-db
          property: connectionString
      - key: DB_SSL
        value: 'true'
      - key: AUTO_RUN_MIGRATIONS
        value: 'true'
      - key: NOTIFY_MAX_ATTEMPTS
        value: '3'
      - key: NOTIFY_INITIAL_BACKOFF_MS
        value: '500'
      - key: IDEMPOTENCY_TTL_SECONDS
        value: '86400'
      # NOTIFY_URL es sensible → setear manualmente en el Render dashboard
      - key: NOTIFY_URL
        sync: false

  # ============================================================================
  # QA — rama qa, Free plan (sleeps tras 15 min de inactividad)
  # ============================================================================
  - type: web
    name: geest-api-qa
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: qa
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: geest-db
          property: connectionString
      - key: DB_SSL
        value: 'true'
      - key: AUTO_RUN_MIGRATIONS
        value: 'true'
      - key: NOTIFY_MAX_ATTEMPTS
        value: '3'
      - key: NOTIFY_INITIAL_BACKOFF_MS
        value: '500'
      - key: IDEMPOTENCY_TTL_SECONDS
        value: '86400'
      - key: NOTIFY_URL
        sync: false
